# curriculo.yml — FUENTE ÚNICA de datos curriculares del módulo 1665 (adaptado a nuestro centro).

modulo:
  codigo: "1665"
  denominacion: Digitalización aplicada al sistema productivo (GS)
  ciclo: Administración de Sistemas Informáticos en Red (ASIR)
  centro: "I.E.S. Severo Ochoa de Elche"
  curso_academico: "2026-2027"
  horas: 34
  ects: 3
  horas_semanales: 1
  semanas: 34
  fin_contenidos: "finales de mayo (semana 34, UD7)"
  alcance_docente: [RA1, RA2, RA3, RA4, RA5, RA6]

resultados_aprendizaje:
  - id: RA1
    ce: 
      -RA1a: Se ha descrito en qué consiste el concepto de digitalización
      -RA1b: Se ha relacionado la implantación de la tecnología digital con la organización de las empresas
      -RA1c: Se han establecido las diferencias y similitudes entre los entornos IT y OT
      -RA1d: Se han identificado los departamentos típicos de las empresas que pueden constituir entornos IT
      -RA1e: Se han seleccionado las tecnologías típicas de la digitalización en planta y en negocio
      -RA1f: Se ha analizado la importancia de la conexión entre entornos IT y OT
      -RA1g: Se han analizado las ventajas de digitalizar una empresa industrial de extremo a extremo
    imparte: este docente
    enunciado: >-
      Analiza el concepto de digitalización y su repercusión en los sectores productivos teniendo
      en cuenta la actividad de la empresa e identificando entornos IT y OT característicos.
  - id: RA2
    ce: 
      -RA2a: Se han identificado las principales tecnologías habilitadoras digitales
      -RA2b: Se han relacionado las THD con el desarrollo de productos y servicios
      -RA2c: Se ha relacionado la importancia de las THD con la economía sostenible y eficiente
      -RA2d: Se han identificado nuevos mercados generados por las THD
      -RA2e: Se ha analizado la implicación de THD tanto en la parte de negocio como en la parte de planta
      -RA2f: Se han identificado las mejoras producidas debido a la implantación de las tecnologías habilitadoras en relación con los entornos IT y OT
      -RA2g: Se ha elaborado un informe que relacione, las tecnologías con sus características y áreas de aplicación
    imparte: este docente
    enunciado: >-
      Caracteriza las tecnologías habilitadoras digitales necesarias para la adecuación/transformación
      de las empresas a entornos digitales describiendo sus características y aplicaciones.
  - id: RA3
    ce: 
      -RA3a: Se han identificado los diferentes niveles de la cloud/nube
      -RA3b: Se han identificado las principales funciones de la cloud/nube (procesamiento de datos, intercambio de información, ejecución de aplicaciones, entre otros)
      -RA3c: Se ha descrito el concepto de edge computing y su relación con la cloud/nube
      -RA3d: Se han definido los conceptos de fog y mist y sus zonas de aplicación en el conjunto
      -RA3e: Se han identificado las ventajas que proporciona la utilización de la cloud/nube en los sistemas conectados
    imparte: este docente
    enunciado: >-
      Identifica sistemas basados en cloud/nube y su influencia en el desarrollo de los sistemas digitales.
  - id: RA4
    ce: 
      -RA4a: Se ha identificado la importancia de la IA en la automatización de procesos y su optimización
      -RA4b: Se ha relacionado la IA con la recogida masiva de datos (Big Data) y su tratamiento (análisis) con la rentabilidad de las empresas
      -RA4c: Se ha valorado la importancia presente y futura de la IA
      -RA4d: Se han identificado los sectores con implantación más relevante de IA
      -RA4e: Se han identificado los lenguajes de programación en IA
      -RA4f: Se ha descrito como influye la IA en el sector del título
    imparte: este docente
    enunciado: >-
      Identifica aplicaciones de la IA (inteligencia artificial) en entornos del sector donde está
      enmarcado el título describiendo las mejoras implícitas en su implementación.
  - id: RA5
    ce: 
      -RA5a: Se ha establecido la diferencia entre dato e información
      -RA5b: Se ha descrito el ciclo de vida del dato
      -RA5c: Se ha identificado la relación entre Big Data, análisis de datos, machine/ deep learning e inteligencia
      -RA5d: Se han descrito las características que definen Big Data
      -RA5e: Se han descrito las etapas típicas de la ciencia de datos y su relación en el proceso
      -RA5f: Se han descrito los procedimientos de almacenaje de datos en la cloud/nube
      -RA5g: Se ha descrito la importancia del cloud computing
      -RA5h: Se han identificado los principales objetivos de la ciencia de datos en las diferentes empresas
      -RA5i: Se ha valorado la importancia de la seguridad y su regulación en relación con los datos
    imparte: este docente
    enunciado: >-
      Evalúa la importancia de los datos, así como su protección en una economía digital globalizada,
      definiendo sistemas de seguridad y ciberseguridad tanto a nivel de equipo/sistema, como globales.
  - id: RA6
    ce: 
      -RA6a: Se han identificado los objetivos estratégicos de la empresa
      -RA6b: Se han identificado y alineado las áreas de producción/negocio y de comunicaciones
      -RA6c: Se han identificado las áreas susceptibles de ser digitalizadas
      -RA6d: Se ha analizado el encaje de AD (áreas digitalizadas) entre sí y con las que no lo están
      -RA6e: Se han tenido en cuenta las necesidades presentes y futuras de la empresa
      -RA6f: Se han relacionado cada una de las áreas con la implantación de las tecnologías
      -RA6g: Se han analizado las posibles brechas de seguridad en cada una de las áreas
      -RA6h: Se ha definido el tratamiento de los datos y su análisis
      -RA6i: Se ha tenido en cuenta la integración entre datos, aplicaciones, plataformas que los soportan, entre otros
      -RA6j: Se han documentado los cambios realizados en función de la estrategia
      -RA6k: Se han tenido en cuenta la idoneidad de los recursos humanos
    imparte: este docente
    enunciado: >-
      Desarrolla un proyecto de transformación digital de una empresa de un sector relacionado con el título,
      teniendo en cuenta los cambios que se deben producir en función de los objetivos de la empresa.

