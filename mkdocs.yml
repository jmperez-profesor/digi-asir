site_name: "Digitalización Aplicada al Sistema Productivo (DAW)"
site_url: "https://jmperez-profesor.github.io/digi-asir/"
site_author: "Profesorado DAW - IES Severo Ochoa"
site_description: "Apuntes y recursos didácticos para el módulo 1665 — Digitalización aplicada al sistema productivo (2º DAW)."

repo_url: "https://github.com/jmperez-profesor/digi-asir"
repo_name: "jmperez-profesor/digi-asir"

copyright: "Copyright &copy; 2026 I.E.S. Severo Ochoa — Licencia CC BY-NC-SA 4.0"

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - git-revision-date-localized:
      locale: es
      fallback_to_build_date: true
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Inicio: index.md
  - Normativa y Currículo: normativa/index.md
  - Unidades Didácticas:
    - "UD1: Digitalización en Sistemas Productivos": UD1/index.md
    - "UD2: Tecnologías Habilitadoras (THD)": UD2/index.md
    - "UD3: Computación en la Nube": UD3/index.md
    - "UD4: Inteligencia Artificial": UD4/index.md
    - "UD5: Big Data": UD5/index.md
    - "UD6: Ciberseguridad": UD6/index.md
    - "UD7: Proyecto de Transformación Digital": UD7/index.md
  - Prácticas y Talleres:
    - "Prácticas UD1": practicas/UD1/index.md
    - "Prácticas UD2": practicas/UD2/index.md
    - "Prácticas UD3": practicas/UD3/index.md
    - "Prácticas UD4": practicas/UD4/index.md
    - "Prácticas UD5": practicas/UD5/index.md
    - "Prácticas UD6": practicas/UD6/index.md
    - "Prácticas UD7": practicas/UD7/index.md
